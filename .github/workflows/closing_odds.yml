name: NBA Closing Odds Capture

on:
  workflow_dispatch:
  repository_dispatch: # Webhook POST de cron-job.org, igual que el pipeline diario
    types: [capture-closing]
  # 17:30 y 19:30 CDMX. El cron de GitHub puede retrasarse; una corrida tardía no altera nada
  # porque solo se actualizan partidos que aún no empiezan. Dos capturas por el límite de créditos.
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 1 * * *'

permissions:
  contents: write

concurrency:
  group: history-writes
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📉 Guardar cuota de cierre
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_REGION: ${{ secrets.ODDS_API_REGION || 'us' }}
        run: |
          python capture_closing.py

      - name: 💾 Guardar y hacer push del historial actualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history/
          if git diff --staged --quiet; then
            echo "No hay cambios en el historial para commitear."
          else
            git commit -m "chore(history): actualizar cuotas de cierre [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
